# ===== Neko Desktop v10 : Kitty 猫娘玻璃终端 =====

font_family      FantasqueSansM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

cursor               #ff8cc6
cursor_text_color    #1e1318
cursor_shape         underline

# 玻璃效果: 透明 + 黑色遮罩 + 模糊
background            #0b0709
background_opacity    0.16
background_blur       32
background_tint       0.25

foreground            #f5d6e6
selection_background  #ff8cc6
selection_foreground  #1e1318
url_color             #8fc7ff

color0  #3a2630
color1  #ff6b9d
color2  #a8e6b0
color3  #ffd166
color4  #8fc7ff
color5  #ff8cc6
color6  #8ae3e8
color7  #f5d6e6
color8  #6a4a5a
color9  #ff85ad
color10 #baf0c2
color11 #ffe08a
color12 #a8d4ff
color13 #ffaad6
color14 #b2f2f5
color15 #fff0f7

window_padding_width  12
hide_window_decorations titlebar-only

active_border_color   #ff8cc6
inactive_border_color #3a2630
bell_border_color     #ff6b9d

tab_bar_style powerline
tab_powerline_style round
tab_bar_edge top
tab_bar_min_tabs 1
tab_activity_symbol " 🐾"
bell_on_tab " 💗"
active_tab_foreground   #1e1318
active_tab_background   #ff8cc6
inactive_tab_foreground #c9a0b5
inactive_tab_background #2a1e28

window_title_template "🐱🎀 Neko | {title}"

scrollback_lines 10000
enable_audio_bell no
mouse_hide_wait 0.5
confirm_os_window_close 0
